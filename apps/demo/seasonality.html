<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Charton | Seasonality demo</title>
    <style>
      :root {
        --bg: #0a0a0e;
        --ink: #babac6;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #e8e8ee;
          --ink: #34343f;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font: 13px system-ui, sans-serif;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 12px;
      }
      #chart {
        height: 520px;
      }
    </style>
  </head>
  <body>
    <p>Five years of synthetic daily closes, each year overlaid on one calendar window, with the average path and the range of the years.</p>
    <div class="controls">
      <label>Window
        <select id="window">
          <option value="year">Year</option>
          <option value="quarter">Quarter</option>
          <option value="month">Month</option>
        </select>
      </label>
      <label>Normalise
        <select id="normalize">
          <option value="percent">Percent</option>
          <option value="indexed">Indexed to 100</option>
          <option value="none">Price</option>
        </select>
      </label>
      <label>Align by
        <select id="align">
          <option value="calendar">Calendar day</option>
          <option value="trading">Trading day</option>
        </select>
      </label>
      <label>Average
        <select id="average">
          <option value="mean">Mean</option>
          <option value="median">Median</option>
          <option value="">None</option>
        </select>
      </label>
    </div>
    <div id="chart"></div>
    <script type="module" src="/src/seasonality.ts"></script>
  </body>
</html>
