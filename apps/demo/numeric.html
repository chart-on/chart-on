<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Charton | Numeric axis demo</title>
    <style>
      #charts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        background: var(--panel);
        border-radius: 6px;
        padding: 8px;
      }
      figcaption {
        margin-bottom: 6px;
      }
      .chart {
        height: 320px;
      }
    </style>
  </head>
  <body>
    <p>Charts whose horizontal axis is a number instead of time (<code>createNumericChart</code>). Drag to pan, scroll to zoom, double-click to fit.</p>
    <div id="charts">
      <figure>
        <figcaption>Order-book depth (price on x)</figcaption>
        <div id="depth" class="chart"></div>
      </figure>
      <figure>
        <figcaption>Yield curve (maturity in years on x)</figcaption>
        <div id="yield" class="chart"></div>
      </figure>
      <figure>
        <figcaption>Open interest by strike</figcaption>
        <div id="strikes" class="chart"></div>
      </figure>
    </div>
    <script type="module" src="/src/numeric.ts"></script>
  </body>
</html>
