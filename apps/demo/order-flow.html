<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Charton | Order flow demo</title>
    <style>
      h2 {
        margin: 12px 0 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .chart {
        height: 42vh;
        min-height: 260px;
      }
    </style>
  </head>
  <body>
    <p>
      Three days of synthetic trades with aggressor sides, live: a footprint chart of 5-minute bars and TPO profiles of
      30-minute periods per UTC day. Zoom out to see the rows give way to blocks and range bars.
    </p>
    <div class="controls">
      <label>Footprint values
        <select id="values">
          <option value="split">Sell and buy</option>
          <option value="delta">Delta</option>
          <option value="volume">Volume</option>
        </select>
      </label>
      <label><input id="letters" type="checkbox" checked /> TPO letters</label>
    </div>
    <h2>Footprint</h2>
    <div id="footprint" class="chart"></div>
    <h2>TPO profile</h2>
    <div id="tpo" class="chart"></div>
    <script type="module" src="/src/order-flow.ts"></script>
  </body>
</html>
