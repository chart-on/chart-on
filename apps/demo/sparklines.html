<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Charton | Static charts demo</title>
    <style>
      :root {
        --bg: #0a0a0e;
        --panel: #121217;
        --ink: #babac6;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #e8e8ee;
          --panel: #ffffff;
          --ink: #34343f;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font: 13px system-ui, sans-serif;
      }
      #main {
        height: 360px;
        margin-bottom: 16px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 8px;
      }
      .tile {
        background: var(--panel);
        border-radius: 6px;
        padding: 6px 8px;
      }
      .spark {
        height: 96px;
      }
    </style>
  </head>
  <body>
    <p>One interactive chart and 40 static ones (<code>interactive: false</code>). Static charts hold a WebGL context only while they draw.</p>
    <div id="main"></div>
    <div id="grid"></div>
    <script type="module" src="/src/sparklines.ts"></script>
  </body>
</html>
