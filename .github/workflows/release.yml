name: Release

# Publishes a new version once its release pull request (`pnpm version-packages`, see
# CONTRIBUTING.md#releases) is merged into main: the eight packages to npm, then the GitHub release.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish
    if: github.repository == 'chart-on/charton'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release tag and the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A version is released once it has a CHANGELOG.md section and no GitHub release yet. A failed
      # run is retried by the next push, since changeset publish skips the packages npm already has.
      - name: Find a version to release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if ls .changeset/*.md | grep -qv README.md; then
            echo "Changesets are pending: version them in a release pull request first."
          elif gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released."
          elif ! node scripts/version-packages.mjs notes "$version" > "$RUNNER_TEMP/notes.md" 2> /dev/null; then
            echo "CHANGELOG.md has no $version section yet: nothing to release."
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      # Version comes from the packageManager field in package.json.
      - if: steps.check.outputs.version
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - if: steps.check.outputs.version
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # pnpm publish hands the packed tarball to npm, and trusted publishing needs npm 11.5.1 or later.
      - if: steps.check.outputs.version
        run: npm install -g npm@latest && pnpm install --frozen-lockfile

      - name: Publish
        if: steps.check.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          # Only until trusted publishing is set up for every package (CONTRIBUTING.md#releases).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          pnpm release
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
